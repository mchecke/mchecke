<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Manage Games</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
  th { background: #eee; }
  input[type="text"] { width: 100%; box-sizing: border-box; }
  .actions { margin-top: 15px; }
  button { padding: 6px 12px; margin-right: 8px; cursor: pointer; }
  .del-btn { color: red; cursor: pointer; }
  nav { margin-bottom: 15px; }
</style>
</head>
<body>

<nav><a href="index.html">Go to Landing Page</a></nav>

<h1>Admin: Manage Games</h1>
<p>Enter game info below. Data is saved automatically in this browser (localStorage).</p>

<table id="gamesTable">
  <thead>
    <tr>
      <th>Matchup</th>
      <th>Location</th>
      <th>Date</th>
      <th>Time (EST)</th>
      <th>Remove</th>
    </tr>
  </thead>
  <tbody id="gamesBody">
    <!-- rows inserted here -->
  </tbody>
</table>

<div class="actions">
  <button onclick="addRow()">+ Add Row</button>
</div>

<script>
const STORAGE_KEY = "games";

function loadGames() {
  const raw = localStorage.getItem(STORAGE_KEY);
  return raw ? JSON.parse(raw) : [];
}

function saveGames(games) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
}

function render() {
  const games = loadGames();
  const tbody = document.getElementById("gamesBody");
  tbody.innerHTML = "";

  games.forEach((game, index) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(game.matchup)}" placeholder="Patriots v Seahawks" onchange="updateField(${index}, 'matchup', this.value)"></td>
      <td><input type="text" value="${escapeHtml(game.location)}" placeholder="Seattle" onchange="updateField(${index}, 'location', this.value)"></td>
      <td><input type="text" value="${escapeHtml(game.date)}" placeholder="September 7, 2026" onchange="updateField(${index}, 'date', this.value)"></td>
      <td><input type="text" value="${escapeHtml(game.time)}" placeholder="8:00 PM EST" onchange="updateField(${index}, 'time', this.value)"></td>
      <td><span class="del-btn" onclick="removeRow(${index})">&#10060;</span></td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return str.replace(/"/g, "&quot;");
}

function addRow() {
  const games = loadGames();
  games.push({ matchup: "", location: "", date: "", time: "" });
  saveGames(games);
  render();
}

function updateField(index, field, value) {
  const games = loadGames();
  games[index][field] = value;
  saveGames(games);
}

function removeRow(index) {
  const games = loadGames();
  games.splice(index, 1);
  saveGames(games);
  render();
}

render();
</script>

</body>
</html>
