<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Manage Games</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
  th { background: #eee; }
  input[type="text"] { width: 100%; box-sizing: border-box; }
  .actions { margin-top: 15px; }
  button { padding: 6px 12px; margin-right: 8px; cursor: pointer; }
  .del-btn { color: red; cursor: pointer; }
  nav { margin-bottom: 15px; }
  #status { color: #666; font-style: italic; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Games</a>
  <a href="admin.html">Games Admin</a>
  <a href="fantasy.html">Fantasy Awards</a>
  <a href="fantasy-admin.html">Fantasy Admin</a>
</nav>

<h1>Admin: Manage Games</h1>
<p id="status">Loading...</p>

<table id="gamesTable">
  <thead>
    <tr>
      <th>Matchup</th>
      <th>Location</th>
      <th>Date</th>
      <th>Time (EST)</th>
      <th>Remove</th>
    </tr>
  </thead>
  <tbody id="gamesBody"></tbody>
</table>

<div class="actions">
  <button onclick="addRow()">+ Add Row</button>
</div>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== PASTE YOUR FIREBASE CONFIG HERE =====
const firebaseConfig = {
  apiKey: "AIzaSyBwT239OARx21tJl29NUXyHi5DBNLGeJjw",
  authDomain: "game-schedule-d133d.firebaseapp.com",
  projectId: "game-schedule-d133d",
  storageBucket: "game-schedule-d133d.firebasestorage.app",
  messagingSenderId: "918167764058",
  appId: "1:918167764058:web:5bb07920321b1cfc106c63"
};
// =============================================

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const gamesCol = collection(db, "games");

let currentGames = []; // [{id, matchup, location, date, time}]

const status = document.getElementById("status");
const tbody = document.getElementById("gamesBody");

// Live sync: any change anyone makes updates everyone's view
onSnapshot(gamesCol, (snapshot) => {
  currentGames = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  status.textContent = `Connected. ${currentGames.length} game(s) loaded.`;
  render();
}, (err) => {
  status.textContent = "Error connecting to database: " + err.message;
});

function render() {
  tbody.innerHTML = "";
  currentGames.forEach((game) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(game.matchup)}" placeholder="Patriots v Seahawks" data-id="${game.id}" data-field="matchup"></td>
      <td><input type="text" value="${escapeHtml(game.location)}" placeholder="Seattle" data-id="${game.id}" data-field="location"></td>
      <td><input type="text" value="${escapeHtml(game.date)}" placeholder="September 7, 2026" data-id="${game.id}" data-field="date"></td>
      <td><input type="text" value="${escapeHtml(game.time)}" placeholder="8:00 PM EST" data-id="${game.id}" data-field="time"></td>
      <td><span class="del-btn" data-id="${game.id}">&#10060;</span></td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll("input").forEach(input => {
    input.addEventListener("change", async (e) => {
      const id = e.target.getAttribute("data-id");
      const field = e.target.getAttribute("data-field");
      await updateDoc(doc(db, "games", id), { [field]: e.target.value });
    });
  });

  tbody.querySelectorAll(".del-btn").forEach(span => {
    span.addEventListener("click", async (e) => {
      const id = e.target.getAttribute("data-id");
      await deleteDoc(doc(db, "games", id));
    });
  });
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/"/g, "&quot;");
}

window.addRow = async function() {
  await addDoc(gamesCol, { matchup: "", location: "", date: "", time: "" });
};
</script>

</body>
</html>
