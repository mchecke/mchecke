<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin - Fantasy Awards</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; max-width: 700px; }
  th, td { border: 1px solid #999; padding: 6px 8px; text-align: left; }
  th { background: #eee; }
  input[type="text"] { width: 100%; box-sizing: border-box; }
  .actions { margin-top: 10px; }
  button { padding: 6px 12px; margin-right: 8px; cursor: pointer; }
  .del-btn { color: red; cursor: pointer; }
  nav { margin-bottom: 15px; }
  nav a { margin-right: 15px; }
  #status { color: #666; font-style: italic; }
  h2 { margin-top: 40px; }
</style>
</head>
<body>

<nav>
  <a href="index.html">Games</a>
  <a href="admin.html">Games Admin</a>
  <a href="fantasy.html">Fantasy Awards</a>
  <a href="fantasy-admin.html">Fantasy Admin</a>
</nav>

<h1>Admin: Fantasy Awards</h1>

<div id="loginSection">
  <p>Please log in to manage Fantasy Awards.</p>
  <input type="email" id="loginEmail" placeholder="Email"><br><br>
  <input type="password" id="loginPassword" placeholder="Password"><br><br>
  <button id="loginBtn">Log In</button>
  <p id="loginError" style="color: red;"></p>
</div>

<div id="adminSection" style="display: none;">
  <button id="logoutBtn">Log Out</button>
  <p id="status">Loading...</p>

  <h2>Awards</h2>
  <table id="awardsTable">
    <thead>
      <tr>
        <th>Award</th>
        <th>Prize</th>
        <th>Projected Winner</th>
        <th>Final Winner</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody id="awardsBody"></tbody>
  </table>
  <div class="actions">
    <button onclick="addAwardRow()">+ Add Award Row</button>
  </div>

  <h2>People (Roster)</h2>
  <table id="peopleTable">
    <thead>
      <tr>
        <th>Person</th>
        <th>Remove</th>
      </tr>
    </thead>
    <tbody id="peopleBody"></tbody>
  </table>
  <div class="actions">
    <button onclick="addPersonRow()">+ Add Person</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, getDocs
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBwT239OARx21tJl29NUXyHi5DBNLGeJjw",
  authDomain: "game-schedule-d133d.firebaseapp.com",
  projectId: "game-schedule-d133d",
  storageBucket: "game-schedule-d133d.firebasestorage.app",
  messagingSenderId: "918167764058",
  appId: "1:918167764058:web:5bb07920321b1cfc106c63"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const awardsCol = collection(db, "fantasyAwards");
const peopleCol = collection(db, "fantasyPeople");

const loginSection = document.getElementById("loginSection");
const adminSection = document.getElementById("adminSection");
const loginError = document.getElementById("loginError");

document.getElementById("loginBtn").addEventListener("click", async () => {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  loginError.textContent = "";
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    loginError.textContent = "Login failed: " + err.message;
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  signOut(auth);
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    loginSection.style.display = "none";
    adminSection.style.display = "block";
  } else {
    loginSection.style.display = "block";
    adminSection.style.display = "none";
  }
});

const status = document.getElementById("status");
const awardsBody = document.getElementById("awardsBody");
const peopleBody = document.getElementById("peopleBody");

let currentAwards = [];
let currentPeople = [];

// Default rows to seed the Awards table if it's empty (first time only)
const DEFAULT_AWARDS = [
  { order: 1, award: "Longest Win Streak", prize: "10", projectedWinner: "TBD", finalWinner: "TBD" },
  { order: 2, award: "First Loser", prize: "10", projectedWinner: "TBD", finalWinner: "TBD" },
  { order: 3, award: "Most Total Points", prize: "10", projectedWinner: "TBD", finalWinner: "TBD" },
  ...Array.from({ length: 14 }, (_, i) => ({
    order: 4 + i,
    award: `Week ${i + 1} Winner`,
    prize: "5",
    projectedWinner: "TBD",
    finalWinner: "TBD"
  }))
];

// Default roster to seed the People table if it's empty (first time only)
const DEFAULT_PEOPLE = ["Sam", "Olivia", "Steve", "Ben", "Mark", "Megan", "Brett", "Luke", "John", "Michael"];

async function seedIfEmpty() {
  const awardsSnap = await getDocs(awardsCol);
  if (awardsSnap.empty) {
    for (const row of DEFAULT_AWARDS) {
      await addDoc(awardsCol, row);
    }
  }

  const peopleSnap = await getDocs(peopleCol);
  if (peopleSnap.empty) {
    for (const name of DEFAULT_PEOPLE) {
      await addDoc(peopleCol, { name });
    }
  }
}

seedIfEmpty();

onSnapshot(awardsCol, (snapshot) => {
  currentAwards = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  currentAwards.sort((a, b) => (a.order || 0) - (b.order || 0));
  renderAwards();
  updateStatus();
}, (err) => {
  status.textContent = "Error connecting to database: " + err.message;
});

onSnapshot(peopleCol, (snapshot) => {
  currentPeople = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
  renderPeople();
  updateStatus();
}, (err) => {
  status.textContent = "Error connecting to database: " + err.message;
});

function updateStatus() {
  status.textContent = `Connected. ${currentAwards.length} award(s), ${currentPeople.length} people.`;
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/"/g, "&quot;");
}

function renderAwards() {
  awardsBody.innerHTML = "";
  currentAwards.forEach((row) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(row.award)}" data-id="${row.id}" data-field="award"></td>
      <td><input type="text" value="${escapeHtml(row.prize)}" data-id="${row.id}" data-field="prize"></td>
      <td><input type="text" value="${escapeHtml(row.projectedWinner)}" placeholder="TBD" data-id="${row.id}" data-field="projectedWinner"></td>
      <td><input type="text" value="${escapeHtml(row.finalWinner)}" placeholder="TBD" data-id="${row.id}" data-field="finalWinner"></td>
      <td><span class="del-btn" data-id="${row.id}" data-type="award">&#10060;</span></td>
    `;
    awardsBody.appendChild(tr);
  });

  awardsBody.querySelectorAll("input").forEach(input => {
    input.addEventListener("change", async (e) => {
      const id = e.target.getAttribute("data-id");
      const field = e.target.getAttribute("data-field");
      await updateDoc(doc(db, "fantasyAwards", id), { [field]: e.target.value });
    });
  });

  awardsBody.querySelectorAll(".del-btn").forEach(span => {
    span.addEventListener("click", async (e) => {
      const id = e.target.getAttribute("data-id");
      await deleteDoc(doc(db, "fantasyAwards", id));
    });
  });
}

function renderPeople() {
  peopleBody.innerHTML = "";
  currentPeople.forEach((person) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td><input type="text" value="${escapeHtml(person.name)}" data-id="${person.id}"></td>
      <td><span class="del-btn" data-id="${person.id}">&#10060;</span></td>
    `;
    peopleBody.appendChild(tr);
  });

  peopleBody.querySelectorAll("input").forEach(input => {
    input.addEventListener("change", async (e) => {
      const id = e.target.getAttribute("data-id");
      await updateDoc(doc(db, "fantasyPeople", id), { name: e.target.value });
    });
  });

  peopleBody.querySelectorAll(".del-btn").forEach(span => {
    span.addEventListener("click", async (e) => {
      const id = e.target.getAttribute("data-id");
      await deleteDoc(doc(db, "fantasyPeople", id));
    });
  });
}

window.addAwardRow = async function() {
  const nextOrder = currentAwards.length ? Math.max(...currentAwards.map(a => a.order || 0)) + 1 : 1;
  await addDoc(awardsCol, { order: nextOrder, award: "", prize: "", projectedWinner: "TBD", finalWinner: "TBD" });
};

window.addPersonRow = async function() {
  await addDoc(peopleCol, { name: "" });
};
</script>

</body>
</html>
